# Keep IPv4 per address and group IPv6 clients by /64.
map $binary_remote_addr $login_name_client_key {
  "~^(?<ipv6_prefix>[\s\S]{8})[\s\S]{8}$" $ipv6_prefix;
  default $binary_remote_addr;
}

map $request_method $login_name_limit_key {
  default "";
  POST $login_name_client_key;
}

limit_req_zone $login_name_limit_key zone=login_name_actions:10m rate=10r/m;

server {
  listen 8080;
  server_name _;
  absolute_redirect off;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Login V2 server actions put an external redirect in their first RSC row and keep streaming the
  # re-rendered page. The client follows the redirect as soon as that row arrives; Firefox and
  # Safari then cancel the rest of the stream, a component renders without its
  # NextIntlClientProvider, and Next.js flashes "This page couldn't load" until the redirect
  # commits. Upstream: https://github.com/zitadel/zitadel/issues/12745 (Firefox),
  # https://github.com/zitadel/zitadel/issues/12507 and
  # https://github.com/zitadel/zitadel/issues/12505 (Safari),
  # https://github.com/vercel/next.js/issues/81377 (Next.js, which documents this workaround).
  #
  # nginx passes a buffer to the client only when it is full or the upstream response has ended.
  # With 64k buffers, a response up to 64k reaches the browser in one piece, so the redirect row and
  # the rest of the page arrive together. Next.js gzips the responses: a password action is about
  # 9 KB on the wire and 31 KB uncompressed, which fits the first buffer either way. Login V2 uses no
  # server-sent events, long polling or WebSockets, so holding a response costs only its own
  # render time.
  #
  # The rule above depends on HTTP/1.0 to the upstream, where Next.js ends a streamed body by
  # closing the connection. Over HTTP/1.1 it answers chunked, and nginx then releases the redirect
  # row within milliseconds despite the 64k buffers. So the version is pinned below;
  # tests/dokploy-compose.test.ts and pnpm check:login-buffering both fail if it changes.
  #   proxy_buffering           on is the default; set here so a later edit cannot drop it unseen.
  #   proxy_buffer_size         the first buffer, which holds the headers and the start of the body.
  #                             The default of one memory page (4k) releases the redirect row early.
  #   proxy_buffers             later buffers are the same size. With the first buffer that is at
  #                             most 576k (64k + 8 x 64k) in memory per response; larger static
  #                             chunks spill to nginx's temp files.
  #   proxy_busy_buffers_size   must be at least one buffer and less than all buffers minus one;
  #                             128k is the 2 x 64k that nginx would otherwise derive.
  #   proxy_http_version        1.0 is the default; set here because the buffering above relies on it.
  # This changes when bytes are released, not which bytes or headers are sent; nothing is cached.
  proxy_buffering on;
  proxy_buffer_size 64k;
  proxy_buffers 8 64k;
  proxy_busy_buffers_size 128k;
  proxy_http_version 1.0;

  set $zitadel_api_upstream zitadel-api:8080;
  set $zitadel_login_upstream zitadel-login:3000;

  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location = / {
    return 302 /ui/v2/login;
  }

  location /assets/ {
    proxy_set_header Host auth.freightclaims.com;
    proxy_set_header X-ZITADEL-Instance-Host auth.freightclaims.com;
    proxy_set_header X-ZITADEL-Public-Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://$zitadel_api_upstream;
  }

  location ~ ^/ui/v2/login/loginname/?$ {
    limit_req zone=login_name_actions burst=5 nodelay;
    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://$zitadel_login_upstream;
  }

  location /ui/v2/login {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://$zitadel_login_upstream;
  }

  location / {
    return 404;
  }
}
